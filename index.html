<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a1930" />
    <meta name="description" content="Demo de Service Desk para la operación de e-commerce de Bevstack." />
    <title>Bevstack | Service Desk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#dashboard" aria-label="Bevstack Service Desk inicio">
          <span class="brand-mark">b</span>
          <span class="brand-copy"><strong>bevstack</strong><small>SERVICE DESK</small></span>
        </a>

        <div class="workspace-label">ESPACIO DE TRABAJO</div>
        <div class="workspace-switcher"><span class="workspace-avatar">B</span><span><strong>Bevstack Ops</strong><small>Equipo de soporte</small></span><span class="chevron">⌄</span></div>

        <div class="nav-label">OPERACIÓN</div>
        <nav class="main-nav" aria-label="Navegación principal">
          <button class="nav-item active" data-view="dashboard"><span class="nav-icon">◫</span>Resumen</button>
          <button class="nav-item" data-view="tickets"><span class="nav-icon">▤</span>Todos los tickets<span class="nav-count" id="nav-total">0</span></button>
          <button class="nav-item" data-view="incidents"><span class="nav-icon">◉</span>Incidentes<span class="nav-count" id="nav-incidents">0</span></button>
          <button class="nav-item" data-view="requests"><span class="nav-icon">◇</span>Solicitudes<span class="nav-count" id="nav-requests">0</span></button>
        </nav>

        <div class="nav-label section-gap">GESTIÓN DEL SERVICIO</div>
        <nav class="main-nav" aria-label="Gestión del servicio">
          <button class="nav-item" data-view="problems"><span class="nav-icon">⌕</span>Análisis de problemas<span class="nav-count" id="nav-problems">0</span></button>
          <button class="nav-item" data-view="catalog"><span class="nav-icon">▦</span>Catálogo</button>
          <button class="nav-item" data-view="service-levels"><span class="nav-icon">◷</span>Niveles de servicio</button>
        </nav>

        <div class="sidebar-bottom">
          <div class="support-card"><span class="support-orb">✦</span><strong>Un equipo, un punto de contacto</strong><p>Account Management y Customer Service mantienen a cada usuario informado.</p></div>
          <div class="profile"><span class="profile-avatar">AM</span><span><strong>Agente de soporte</strong><small>Nivel 1 · En línea</small></span><button class="more-button" aria-label="Más opciones">···</button></div>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <div class="breadcrumb"><span>Bevstack Ops</span><span class="breadcrumb-separator">/</span><strong id="page-crumb">Resumen</strong></div>
          <div class="topbar-actions"><span class="today-label" id="today-label"></span><button class="icon-button" title="Notificaciones" aria-label="Notificaciones">♧<i></i></button><button class="help-button">Ayuda <span>↗</span></button></div>
        </header>
        <div id="app-content" class="content-area" aria-live="polite"></div>
      </main>
    </div>

    <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
  </body>
</html>
